<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectHikari</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #10111b;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 20px;
  background: #1c1d2b;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

.character {
  text-align: center;
  padding: 35px 15px;
}

.avatar {
  font-size: 85px;
}

.character h2 {
  margin-bottom: 5px;
}

.character p {
  color: #aaa;
}

#chat {
  height: 42vh;
  overflow-y: auto;
  padding: 15px;
}

.message {
  background: #282a3b;
  padding: 12px;
  border-radius: 12px;
  margin: 10px 0;
  max-width: 85%;
}

.user {
  background: #6655cc;
  margin-left: auto;
}

.input-area {
  display: flex;
  padding: 12px;
  gap: 8px;
  background: #1c1d2b;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #303144;
  color: white;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px;
  background: #8069ee;
  color: white;
}
</style>
</head>

<body>

<header>ProjectHikari ✨</header>

<section class="character">
  <div class="avatar">🌸</div>
  <h2>Hikari</h2>
  <p>Teman AI virtualmu</p>
</section>

<div id="chat">
  <div class="message">
    Hai! Aku Hikari. Senang bertemu denganmu! ✨
  </div>
</div>

<div class="input-area">
  <input id="input" placeholder="Tulis pesan..." />
  <button onclick="sendMessage()">Kirim</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const message = input.value.trim();

  if (!message) return;

  const user = document.createElement("div");
  user.className = "message user";
  user.textContent = message;
  chat.appendChild(user);

  const reply = document.createElement("div");
  reply.className = "message";
  reply.textContent =
    "Pesanmu sudah kuterima! Koneksi AI sedang dalam tahap pembangunan. ✨";
  chat.appendChild(reply);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
